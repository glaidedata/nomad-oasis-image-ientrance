[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0"

[project]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
name = "nomad-distribution"
description = "nomad distribution template"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "nomad-lab[infrastructure]==1.4.2",
  "setuptools",
  "numpy<2.4",  # numba (required by pynxtools-em) needs numpy 2.3 or less
]


[project.urls]
repository = "https://github.com/glaidedata/nomad-oasis-image-ientrance"

[project.optional-dependencies]
plugins = [
  # Simulations
  "nomad-simulations==0.7.0",
  # "nomad-simulation-apps==0.1.2",
  "nomad-schema-plugin-run==1.0.5",
  "nomad-schema-plugin-simulation-workflow==1.0.11",
  "nomad-normalizer-plugin-bandstructure==1.0.4",
  "nomad-normalizer-plugin-dos==1.0.7",
  "nomad-normalizer-plugin-soap==1.0.2",
  "nomad-normalizer-plugin-spectra==1.0.4",
  "nomad-normalizer-plugin-system==1.0.5",
  "nomad-normalizer-plugin-simulation-workflow==1.0.4",
  "nomad-parser-plugins-electronic==1.0.16",
  "nomad-parser-plugins-atomistic==1.0.12",
  "nomad-parser-plugins-workflow @ git+https://github.com/nomad-coe/workflow-parsers.git@9f2bc2097bb2f1ee5f69b92715c8718209fcd2ec",
  "nomad-parser-plugins-database==1.1.3",

  # Pynxtools readers
  "pynxtools==0.13.2",
  "pynxtools-apm==0.5.1",
  "pynxtools-ellips==0.1.2",
  "pynxtools-em==0.4.4",
  "pynxtools-igor==0.1.5",
  "pynxtools-mpes==0.2.7",
  "pynxtools-raman==0.1.2",
  "pynxtools-spm==0.2.4",
  "pynxtools-xps==0.6.1",
  "pynxtools-xrd==0.0.8",

  # ELN INTEGRATIONS
  "nomad-external-eln-integrations @ git+https://github.com/FAIRmat-NFDI/nomad-external-eln-integrations@982bbb3ed327d0256da59433e9bd66972cb8a86d",

  # Domain-specific ELN and measurement plugins
  "nomad-measurements == 1.3.5",
  "nomad-material-processing == 1.0.5",
  "nomad-analysis == 0.2.1",
  #"nomad-catalysis==1.0.5",
  #"nomad-neb-workflows==1.0.2",
  #"nomad-unisyscat @ git+https://github.com/FAIRmat-NFDI/nomad-unisyscat-plugin.git@main",
  #"nomad-tadf-molecules @ git+https://github.com/FAIRmat-NFDI/nomad-tadf-molecules@main",
  "nomad-polymerization-reactions==1.0.0",
  #"nomad-camels-plugin @ git+https://github.com/FAIRmat-NFDI/nomad-camels-plugin.git@main",

  # Materials and AI
  # "nomad-auto-xrd @ git+https://github.com/FAIRmat-NFDI/nomad-auto-xrd@main",
  # "bayesian-optimization-hpt @ git+https://github.com/ka-sarthak/bayesian-optimization-plugin.git@main",

  # developed reader-plugin
  "fabrication-utilities @ git+https://github.com/sd-fbk/Fabrication-utilities_dev.git@v2.2.0",
  "characterization-utilities @ git+https://github.com/sd-fbk/Characterization-utilities_DEV.git@v2.1.0",

  "nomad-measurements-magnetometry @ git+https://github.com/glaidedata/nomad-measurements-magnetometry.git@v0.3.4",
  "nomad-measurements-afm @ git+https://github.com/glaidedata/nomad-measurements-afm.git@v0.5.5",
  "nomad-measurements-thermal @ git+https://github.com/glaidedata/nomad-measurements-thermal.git@v0.3.4",
  "nomad-measurements-raman @ git+https://github.com/glaidedata/nomad-measurements-raman.git@v0.2.5",
  "nomad-measurements-ald @ git+https://github.com/glaidedata/nomad-measurements-ald.git@v0.2.1",
  "nomad-measurements-dls @ git+https://github.com/glaidedata/nomad-measurements-dls.git@v0.2.1",

  "ientrance-instruments @ git+https://github.com/glaidedata/nomad-ientrance-instruments.git@v0.1.2"

]
jupyter = ["jupyter-events"]
gpu-action = []
cpu-action = []

dev = ["nomad-lab[infrastructure, dev]==1.4.2"]

[tool.uv]
extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/8647/packages/pypi/simple",
]
prerelease = "explicit"
index-strategy = "unsafe-best-match"

[tool.uv.extra-build-dependencies]
flatdict = ["setuptools<82.0.0"]

[tool.setuptools.packages.find]
exclude = ["gui*", "docs*", "config*"]
